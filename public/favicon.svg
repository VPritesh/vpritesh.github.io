<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .text { 
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      font-weight: 900; 
      font-size: 65px; 
      letter-spacing: -3px; 
    }
    .pv { fill: #121110; }
    .slash { fill: #ff4d00; }
    @media (prefers-color-scheme: dark) {
      .pv { fill: #efece4; }
    }
  </style>
  <text x="50" y="70" text-anchor="middle" class="text" dominant-baseline="middle">
    <tspan class="pv">PV</tspan><tspan class="slash">/</tspan>
  </text>
</svg>